<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="">
<title>Vorschau</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: #0c0c0c;
  color: #fff;
  min-height: 100vh;
}

/* ===== LANDING ===== */
#landing { padding: 64px 40px 80px; max-width: 1200px; margin: 0 auto; }

.page-header { text-align: center; margin-bottom: 56px; }
.page-header h1 {
  font-size: 2.6rem; font-weight: 700; letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 0%, #666 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 12px;
}
.page-header p { color: #555; font-size: 1rem; }

.industry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.industry-card {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 22px 20px 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.industry-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--ac);
  border-radius: 12px 0 0 12px;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.industry-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 0% 50%, var(--ac) 0%, transparent 65%);
  opacity: 0;
  transition: opacity 0.25s;
}
.industry-card:hover {
  border-color: #2e2e2e;
  background: #161616;
  transform: translateX(3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.industry-card:hover::before { opacity: 1; }
.industry-card:hover::after { opacity: 0.06; }
.industry-card:hover .ic-arrow { opacity: 1; transform: translateX(0); }

.ic-left { flex: 1; min-width: 0; }
.ic-name { font-size: 0.95rem; font-weight: 700; color: #e0e0e0; letter-spacing: -0.2px; }
.ic-sub { font-size: 0.75rem; color: #3a3a3a; margin-top: 3px; }
.ic-arrow {
  font-size: 0.85rem;
  color: var(--ac);
  opacity: 0;
  transform: translateX(-4px);
  transition: all 0.2s;
  flex-shrink: 0;
  font-weight: 300;
}

/* ===== STYLE VIEW ===== */
#style-view { display: none; padding: 40px; max-width: 1400px; margin: 0 auto; }

.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: none; border: 1px solid #2a2a2a; color: #888;
  padding: 10px 18px; border-radius: 8px; cursor: pointer;
  font-size: 0.875rem; margin-bottom: 36px; transition: all 0.15s;
}
.back-btn:hover { border-color: #555; color: #fff; }

.sv-header { margin-bottom: 40px; }
.sv-header h2 { font-size: 1.8rem; font-weight: 700; }
.sv-header p { color: #555; margin-top: 6px; font-size: 0.9rem; }

.style-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 22px;
}

.style-card {
  background: #161616;
  border: 1px solid #222;
  border-radius: 14px;
  overflow: hidden;
  cursor: default;
  transition: all 0.2s ease;
}
.style-card:hover {
  border-color: #444;
  transform: translateY(-4px);
  box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}

/* mockup preview */
.mockup-wrap {
  width: 100%;
  height: 320px;
  overflow: hidden;
  position: relative;
  background: #111;
  border-bottom: 1px solid #1e1e1e;
}
.mockup-inner {
  width: 860px;
  transform: scale(0.4186);
  transform-origin: top left;
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}

.sc-info { padding: 16px 18px 18px; }
.sc-name { font-size: 0.95rem; font-weight: 700; color: #eee; }
.sc-desc { font-size: 0.8rem; color: #555; margin-top: 4px; line-height: 1.5; }
.sc-badge {
  display: inline-block; margin-top: 10px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
}

/* ===== MOCKUP STYLES ===== */

/* 1 — MODERN MINIMAL */
.mk-modern {
  background: #fff;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  height: 540px;
}
.mk-modern .mn { background:#fff; border-bottom:1px solid #eee; padding:16px 36px; display:flex; justify-content:space-between; align-items:center; }
.mk-modern .mn-logo { font-size:17px; font-weight:800; color:#111; letter-spacing:-0.5px; }
.mk-modern .mn-links { display:flex; gap:24px; }
.mk-modern .mn-links span { font-size:12px; color:#555; }
.mk-modern .mn-cta { background:#111; color:#fff; padding:9px 20px; border-radius:6px; font-size:12px; font-weight:600; }
.mk-modern .mh { padding:64px 36px 48px; text-align:center; background:#f9f9f9; }
.mk-modern .mh h1 { font-size:42px; font-weight:800; color:#111; line-height:1.1; letter-spacing:-1.5px; }
.mk-modern .mh p { font-size:14px; color:#777; margin-top:14px; line-height:1.65; max-width:460px; margin-left:auto; margin-right:auto; }
.mk-modern .mh-btn { display:inline-block; background:#111; color:#fff; padding:13px 32px; border-radius:7px; font-size:13px; font-weight:700; margin-top:24px; }
.mk-modern .mf { display:flex; gap:12px; padding:24px 36px; background:#fff; }
.mk-modern .mfi { flex:1; padding:18px; border:1px solid #eee; border-radius:10px; }
.mk-modern .mfi h3 { font-size:13px; font-weight:700; color:#111; }
.mk-modern .mfi p { font-size:11px; color:#888; margin-top:6px; line-height:1.5; }

/* 2 — PREMIUM DARK */
.mk-premium {
  background:#070707;
  font-family:'Georgia','Times New Roman',serif;
}

.mk-premium .mn { padding:20px 36px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(200,160,60,0.18); }
.mk-premium .mn-logo { font-size:15px; font-weight:700; color:#C8A23C; letter-spacing:4px; text-transform:uppercase; }
.mk-premium .mn-links { display:flex; gap:28px; }
.mk-premium .mn-links span { font-size:10px; color:#666; letter-spacing:2px; text-transform:uppercase; }
.mk-premium .mn-cta { border:1px solid #C8A23C; color:#C8A23C; padding:9px 20px; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.mk-premium .mh { padding:72px 36px 52px; text-align:center; }
.mk-premium .mh-line { width:36px; height:1px; background:#C8A23C; margin:0 auto 20px; }
.mk-premium .mh h1 { font-size:38px; color:#fff; font-weight:400; letter-spacing:2px; line-height:1.25; }
.mk-premium .mh p { font-size:12px; color:#666; margin-top:14px; letter-spacing:0.8px; line-height:1.9; }
.mk-premium .mh-btn { display:inline-block; background:#C8A23C; color:#000; padding:13px 36px; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-top:28px; }
.mk-premium .mf { display:flex; border-top:1px solid #151515; margin-top:20px; }
.mk-premium .mfi { flex:1; padding:24px; text-align:center; border-right:1px solid #111; }
.mk-premium .mfi:last-child { border-right:none; }
.mk-premium .mfi h3 { font-size:10px; color:#C8A23C; letter-spacing:3px; text-transform:uppercase; }
.mk-premium .mfi p { font-size:11px; color:#444; margin-top:8px; line-height:1.6; }

/* 3 — WARM CLASSIC */
.mk-warm {
  background:#FDF6E3;
  font-family:'Georgia','Times New Roman',serif;
}

.mk-warm .mn { background:#fff; border-bottom:2px solid #D4A96A; padding:18px 36px; display:flex; justify-content:space-between; align-items:center; }
.mk-warm .mn-logo { font-size:19px; font-weight:700; color:#5C3317; font-style:italic; }
.mk-warm .mn-links { display:flex; gap:24px; }
.mk-warm .mn-links span { font-size:12px; color:#7B4F2E; }
.mk-warm .mn-cta { background:#8B4513; color:#FDF6E3; padding:9px 20px; border-radius:4px; font-size:12px; }
.mk-warm .mh { padding:60px 36px 44px; text-align:center; }
.mk-warm .mh-orn { font-size:22px; color:#D4A96A; margin-bottom:12px; }
.mk-warm .mh h1 { font-size:38px; font-weight:700; color:#3E1C00; line-height:1.2; }
.mk-warm .mh p { font-size:13px; color:#7B4F2E; margin-top:14px; line-height:1.75; font-style:italic; }

.mk-warm .mf { display:flex; background:#fff; padding:22px 36px; border-top:1px solid #E8D5B5; margin-top:12px; }
.mk-warm .mfi { flex:1; padding:12px 16px; text-align:center; border-right:1px solid #EEE0C8; }
.mk-warm .mfi:last-child { border-right:none; }
.mk-warm .mfi h3 { font-size:13px; font-weight:700; color:#5C3317; }
.mk-warm .mfi p { font-size:11px; color:#9A7A55; margin-top:6px; line-height:1.5; }

/* 4 — BOLD COLORFUL */
.mk-bold {
  background:#fff;
  font-family:'Arial Black','Impact',Arial,sans-serif;
}

.mk-bold .mn { padding:14px 28px; display:flex; justify-content:space-between; align-items:center; }
.mk-bold .mn-logo { font-size:19px; font-weight:900; color:#fff; }
.mk-bold .mn-links { display:flex; gap:20px; }
.mk-bold .mn-links span { font-size:12px; color:rgba(255,255,255,0.85); font-family:Arial,sans-serif; font-weight:600; }
.mk-bold .mn-cta { background:#fff; padding:9px 20px; border-radius:50px; font-size:12px; font-weight:900; }
.mk-bold .mh { padding:64px 36px 48px; text-align:center; }
.mk-bold .mh h1 { font-size:48px; font-weight:900; color:#fff; line-height:1; text-transform:uppercase; letter-spacing:-1px; }

.mk-bold .mfi p { font-size:10px; color:#666; margin-top:5px; font-family:Arial,sans-serif; font-weight:400; line-height:1.4; }

/* 5 — NATURE ORGANIC */

  background:#F4EFE4;
  font-family:Georgia,serif;
}

.mk-nature .mn { background:#2A4220; padding:16px 36px; display:flex; justify-content:space-between; align-items:center; }
.mk-nature .mn-logo { font-size:17px; font-weight:700; color:#9EC86F; }
.mk-nature .mn-links { display:flex; gap:24px; }
.mk-nature .mn-links span { font-size:12px; color:rgba(255,255,255,0.65); }
.mk-nature .mn-cta { background:#9EC86F; color:#1A3010; padding:9px 20px; border-radius:50px; font-size:12px; font-weight:700; }
.mk-nature .mh { padding:60px 36px 44px; text-align:center; background:linear-gradient(180deg,#E0EDCC 0%,#F4EFE4 100%); }

.mk-nature .mh h1 { font-size:38px; font-weight:700; color:#2A4220; line-height:1.2; }
.mk-nature .mh p { font-size:13px; color:#527A3A; margin-top:14px; line-height:1.75; }
.mk-nature .mh-btn { display:inline-block; background:#2A4220; color:#9EC86F; padding:13px 32px; border-radius:50px; font-size:13px; font-weight:700; margin-top:22px; }
.mk-nature .mf { display:flex; gap:10px; padding:20px 28px; background:#fff; margin-top:10px; }
.mk-nature .mfi { flex:1; padding:16px; border-left:3px solid #9EC86F; }
.mk-nature .mfi h3 { font-size:13px; font-weight:700; color:#2A4220; }
.mk-nature .mfi p { font-size:11px; color:#6A8A52; margin-top:6px; line-height:1.5; }

/* 6 — TECH FUTURISTIC */
.mk-tech {
  background:#060C18;
  font-family:Arial,sans-serif;
}

.mk-tech .mn { background:rgba(0,220,255,0.03); border-bottom:1px solid rgba(0,220,255,0.12); padding:16px 36px; display:flex; justify-content:space-between; align-items:center; }

.mk-tech .mh-tag { display:inline-block; border:1px solid rgba(0,220,255,0.2); color:#00DCFF; font-size:9px; letter-spacing:4px; padding:5px 14px; margin-bottom:20px; font-family:'Courier New',monospace; }

.mk-tech .mh p { font-size:13px; color:rgba(255,255,255,0.42); margin-top:14px; line-height:1.75; }
.mk-tech .mh-btn { display:inline-block; background:#00DCFF; color:#000; padding:13px 32px; font-size:11px; font-weight:800; letter-spacing:3px; margin-top:26px; }
.mk-tech .mf { display:flex; gap:10px; padding:18px 28px; border-top:1px solid rgba(0,220,255,0.08); margin-top:14px; }
.mk-tech .mfi { flex:1; padding:14px; border:1px solid rgba(0,220,255,0.09); background:rgba(0,220,255,0.02); }
.mk-tech .mfi h3 { font-size:11px; color:#00DCFF; letter-spacing:2px; font-family:'Courier New',monospace; }
.mk-tech .mfi p { font-size:11px; color:rgba(255,255,255,0.35); margin-top:6px; line-height:1.5; }

.mk-bold .mbanner p { font-size:13px; color:rgba(255,255,255,0.75); margin-top:6px; font-family:Arial,sans-serif; }

/* ===== PREVIEW MODAL ===== */
#preview-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(6px);
}
#preview-modal.open { display: flex; }

.pm-box {
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  width: 100%;
  max-width: 920px;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 100px rgba(0,0,0,0.7);
  animation: pmIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes pmIn {
  from { transform: scale(0.94) translateY(12px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

.pm-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid #1c1c1c; flex-shrink: 0;
}
.pm-title { font-size: 0.95rem; font-weight: 700; color: #eee; }
.pm-sub { font-size: 0.75rem; color: #444; margin-top: 2px; }
.pm-close {
  background: none; border: 1px solid #2a2a2a; color: #666;
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  font-size: 13px; line-height: 1; transition: all 0.15s; flex-shrink: 0;
}
.pm-close:hover { border-color: #555; color: #fff; background: #1a1a1a; }

.pm-browser-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: #0e0e0e;
  border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
}
.pm-dots { display: flex; gap: 6px; }
.pm-dots span {
  width: 10px; height: 10px; border-radius: 50%;
  background: #333; display: block;
}
.pm-dots span:nth-child(1) { background: #555; }
.pm-dots span:nth-child(2) { background: #444; }
.pm-dots span:nth-child(3) { background: #3a3a3a; }
.pm-url {
  flex: 1; background: #1a1a1a; border: 1px solid #222;
  border-radius: 6px; padding: 5px 12px;
  font-size: 11px; color: #555; font-family: monospace;
}

.pm-body {
  overflow-y: auto; overflow-x: hidden; flex: 1;
}
.pm-body::-webkit-scrollbar { width: 6px; }
.pm-body::-webkit-scrollbar-track { background: #0a0a0a; }
.pm-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

.pm-mockup { width: 860px; min-width: 860px; }

/* Style card — cursor pointer für Modal-Öffnung */
.style-card { cursor: pointer; }
.sc-hint {
  font-size: 0.72rem; color: #333; margin-top: 6px;
  letter-spacing: 0.3px;
}

/* ===== ANIMATIONEN ===== */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.page-header {
  animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
.sv-header {
  animation: slideDown 0.4s cubic-bezier(0.16,1,0.3,1) both;
}

.industry-card {
  opacity: 0;
  animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
}
.style-card {
  opacity: 0;
  animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
}
.back-btn {
  animation: fadeIn 0.35s ease both;
}

/* Glow-Pulse auf Hover für Industry-Karten */
.industry-card:hover::after {
  animation: none;
}

/* Seiten-Übergang */
#landing, #style-view {
  transition: opacity 0.25s ease;
}
#landing.fading, #style-view.fading {
  opacity: 0;
  pointer-events: none;
}
</style>

(function() {
  // Rechtsklick sperren
  document.addEventListener('contextmenu', e => e.preventDefault());

  // F12, Strg+U, Strg+Shift+I/J/C sperren
  document.addEventListener('keydown', e => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.key === 'u') ||
      (e.ctrlKey && e.shiftKey && ['i','j','c','I','J','C'].includes(e.key))
    ) e.preventDefault();
  });
})();

function navHtml(cls, ind) {
  return `<div class="${cls} mn">
    <div class="mn-logo">${ind.name2}</div>
    <div class="mn-links">${ind.navItems.map(n=>`<span>${n}</span>`).join('')}</div>
    <div class="mn-cta">${ind.cta}</div>
  </div>`;
}

function featHtml(cls, ind) {
  return `<div class="${cls} mf">${ind.f.map(x=>`<div class="${cls} mfi"><h3>${x.t}</h3><p>${x.d}</p></div>`).join('')}</div>`;
}

function renderMockup(styleId, ind) {
  const gc  = galleryColors[ind.id]  || ['#333','#444','#555'];
  const sts = industryStats[ind.id]  || [{n:'100+',l:'Projekte'},{n:'4.8',l:'Bewertung'},{n:'10',l:'Jahre'}];
  const ac  = industryAccent[ind.id] || '#333333';

  const galImgs = (h, br='0') => [
    `<div class="mgal-img" style="background:linear-gradient(140deg,${gc[0]},${gc[1]});height:${h}px;border-radius:${br}px;flex:1;"></div>`,
    `<div class="mgal-img" style="background:linear-gradient(200deg,${gc[1]},${gc[2]});height:${h}px;border-radius:${br}px;flex:1;"></div>`,
    `<div class="mgal-img" style="background:linear-gradient(60deg,${gc[2]},${gc[0]});height:${h}px;border-radius:${br}px;flex:1;"></div>`
  ].join('');

  /* ---- MODERN — Industry accent färbt Buttons, Features, Stats ---- */
  if (styleId === 'modern') return `
    <div class="mk-modern">
      <div class="mk-modern mn">
        <div class="mn-logo">${ind.name2}</div>
        <div class="mn-links">${ind.navItems.map(n=>`<span>${n}</span>`).join('')}</div>
        <div class="mn-cta" style="background:${ac};">${ind.cta}</div>
      </div>
      <div class="mk-modern mh" style="background:linear-gradient(135deg,#f9f9f9 0%,${ac}0d 100%);">
        <h1>${ind.hero}</h1>
        <p>${ind.sub}</p>
        <div class="mk-modern mh-btn" style="background:${ac};">${ind.cta}</div>
      </div>
      <div class="mk-modern mf">
        ${ind.f.map(x=>`<div class="mk-modern mfi" style="border-top:3px solid ${ac};"><h3 style="color:${ac};">${x.t}</h3><p>${x.d}</p></div>`).join('')}
      </div>
      <div class="mk-modern mabout">
        <div class="mabout-img" style="background:linear-gradient(140deg,${gc[0]},${gc[1]});"></div>
        <div>
          <h3 style="color:${ac};">Über uns</h3>
          <p>Seit Jahren stehen wir für Qualität und persönliche Betreuung. Lernen Sie uns und unsere Arbeit kennen — wir freuen uns auf Sie.</p>

      </div>
    </div>`;

  /* ---- PREMIUM — Gold bleibt, Hero bekommt Industry-Glow ---- */
  if (styleId === 'premium') return `
    <div class="mk-premium">
      <div class="mk-premium mn">
        <div class="mn-logo">${ind.name2.toUpperCase()}</div>
        <div class="mn-links">${ind.navItems.map(n=>`<span>${n}</span>`).join('')}</div>
        <div class="mn-cta">${ind.cta}</div>
      </div>
      <div class="mk-premium mh" style="background:radial-gradient(ellipse at 50% -10%,${ac}28 0%,#070707 55%);">
        <div class="mk-premium mh-line"></div>
        <h1>${ind.hero}</h1>
        <p>${ind.sub}</p>
        <div class="mk-premium mh-btn">${ind.cta}</div>
      </div>

        ${sts.map(s=>`<div class="mk-premium mstat"><div class="mstat-n">${s.n}</div><div class="mstat-l">${s.l}</div></div>`).join('')}
      </div>
      <div class="mk-premium mf">
        ${ind.f.map(x=>`<div class="mk-premium mfi"><h3>${x.t}</h3><p>${x.d}</p></div>`).join('')}
      </div>
      <div class="mk-premium mgal">${galImgs(120)}</div>
    </div>`;

    <div class="mk-warm">

    <div class="mk-bold">

        <div class="mn-logo">${ind.name2}</div>

      <div class="mk-bold mh" style="background:linear-gradient(135deg,${ac} 0%,${ac}bb 100%);">
        <h1>${ind.hero}</h1>
        <p>${ind.sub}</p>
        <div class="mk-bold mh-btn" style="color:${ac};">${ind.cta}</div>
      </div>
      <div class="mk-bold mf">
        ${ind.f.map(x=>`<div class="mk-bold mfi"><h3 style="color:${ac};">${x.t}</h3><p>${x.d}</p></div>`).join('')}
      </div>
      <div class="mk-bold mgal">${galImgs(120, 8)}</div>
      <div class="mk-bold mbanner" style="background:linear-gradient(135deg,${ac},${ac}cc);">
        <h3>Jetzt starten</h3>
        <p>Keine langen Wartezeiten — direkt online buchen</p>
        <div class="mbanner-btn" style="color:${ac};">${ind.cta}</div>
      </div>
    </div>`;

  /* ---- NATURE — Grüne Struktur bleibt, Industry accent für CTA & Borders ---- */
  if (styleId === 'nature') return `
    <div class="mk-nature">
      <div class="mk-nature mn">
        <div class="mn-logo">${ind.name2}</div>
        <div class="mn-links">${ind.navItems.map(n=>`<span>${n}</span>`).join('')}</div>
        <div class="mn-cta" style="background:${ac};color:#fff;">${ind.cta}</div>
      </div>
      <div class="mk-nature mh">
        <h1>${ind.hero}</h1>
        <p>${ind.sub}</p>
        <div class="mk-nature mh-btn" style="background:${ac};color:#fff;">${ind.cta}</div>
      </div>
      <div class="mk-nature mf">
        ${ind.f.map(x=>`<div class="mk-nature mfi" style="border-left:3px solid ${ac};"><h3 style="color:#2A4220;">${x.t}</h3><p>${x.d}</p></div>`).join('')}
      </div>
      <div class="mk-nature mabout">
        <div class="mabout-img" style="background:linear-gradient(140deg,${gc[0]},${gc[1]});min-height:140px;"></div>
        <div class="mabout-text">
          <h3 style="color:${ac};">Unsere Geschichte</h3>
          <p>Wir glauben an natürliche Qualität und Nachhaltigkeit. Jedes Produkt — mit Verantwortung für Mensch und Natur.</p>
        </div>
      </div>
      <div class="mk-nature mgal">${galImgs(110, 4)}</div>
    </div>`;

  /* ---- TECH — Rahmen & Struktur in Industry accent statt Cyan ---- */
  if (styleId === 'tech') {
    const w = ind.hero.split(' ');
    const em = w.slice(0,2).join(' ');
    const rest = w.slice(2).join(' ');
    return `
    <div class="mk-tech" style="background:#060C18;">
      <div class="mk-tech mn" style="border-bottom:1px solid ${ac}22;background:${ac}05;">
        <div class="mn-logo" style="color:${ac};letter-spacing:3px;font-family:'Courier New',monospace;">${ind.name2.toUpperCase()}</div>
        <div class="mn-links">${ind.navItems.map(n=>`<span style="color:${ac}66;">${n}</span>`).join('')}</div>
        <div class="mn-cta" style="border:1px solid ${ac}55;color:${ac};">${ind.cta}</div>
      </div>
      <div class="mk-tech mh">
        <div class="mk-tech mh-tag" style="border:1px solid ${ac}33;color:${ac};">// NEXT GEN</div>
        <h1><em style="color:${ac};">${em}</em> ${rest}</h1>
        <p>${ind.sub}</p>
        <div class="mk-tech mh-btn" style="background:${ac};color:#fff;letter-spacing:2px;">${ind.cta}</div>
      </div>
      <div class="mk-tech mstats">
        ${sts.map(s=>`<div class="mk-tech mstat" style="border:1px solid ${ac}18;background:${ac}06;"><div class="mstat-n" style="color:${ac};">${s.n}</div><div class="mstat-l">${s.l}</div></div>`).join('')}
      </div>
      <div class="mk-tech mf">
        ${ind.f.map(x=>`<div class="mk-tech mfi" style="border:1px solid ${ac}18;background:${ac}05;"><h3 style="color:${ac};">${x.t}</h3><p>${x.d}</p></div>`).join('')}
      </div>
      <div class="mk-tech mcode">
        <div class="mcode-line"><em style="color:${ac};">const</em> result = <em style="color:${ac};">await</em> <s>api</s>.<em style="color:${ac};">launch</em>({ project: <s>"${ind.name2}"</s> });</div>
        <div class="mcode-line"><em style="color:${ac};">console</em>.<s>log</s>(<s>"✓ Online — ${ind.cta}"</s>);</div>
      </div>
    </div>`;
  }
  return '';
}

function renderLanding() {
  document.getElementById('industryGrid').innerHTML = industries.map((ind, i) => `
    <div class="industry-card" onclick="showStyles('${ind.id}')" style="--ac:${ind.color};animation-delay:${i * 40}ms;">
      <div class="ic-left">
        <div class="ic-name">${ind.name}</div>
        <div class="ic-sub">6 Stile verfügbar</div>
      </div>
      <div class="ic-arrow">→</div>
    </div>`).join('');
}

function showStyles(id) {
  const landing = document.getElementById('landing');
  landing.classList.add('fading');
  setTimeout(() => {
    landing.style.display = 'none';
    landing.classList.remove('fading');
    const ind = industries.find(i => i.id === id);
    const sv = document.getElementById('style-view');
    sv.style.display = 'block';
    sv.style.opacity = '0';
    document.getElementById('sv-title').textContent = ind.name + ' — Stile';
    document.getElementById('styleGrid').innerHTML = stylesMeta.map((s, i) => `
      <div class="style-card" onclick="openPreview('${s.id}','${ind.id}','${s.name}')" style="animation-delay:${i * 60}ms;">
        <div class="mockup-wrap">
          <div class="mockup-inner">${renderMockup(s.id, ind)}</div>
        </div>
        <div class="sc-info">
          <div class="sc-name">${s.name}</div>
          <div class="sc-desc">${s.desc}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
            <span class="sc-badge" style="background:${s.bc}22;color:${s.bc};border:1px solid ${s.bc}44;">${s.badge}</span>
            <span class="sc-hint">Klicken zum Vergrößern →</span>
          </div>
        </div>
      </div>`).join('');
    requestAnimationFrame(() => { sv.style.opacity = '1'; });
  }, 200);
}

function showLanding() {
  const sv = document.getElementById('style-view');
  sv.classList.add('fading');
  setTimeout(() => {
    sv.style.display = 'none';
    sv.classList.remove('fading');
    const landing = document.getElementById('landing');
    landing.style.display = 'block';
    landing.style.opacity = '0';
    requestAnimationFrame(() => { landing.style.opacity = '1'; });
  }, 200);
}

function openPreview(styleId, indId, styleName) {
  const ind = industries.find(i => i.id === indId);
  const style = stylesMeta.find(s => s.id === styleId);
  document.getElementById('pm-title').textContent = ind.name + ' — ' + styleName;
  document.getElementById('pm-url').textContent = 'www.' + ind.name2.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'') + '.de';
  document.getElementById('pm-body').innerHTML = '<div class="pm-mockup">' + renderMockup(styleId, ind) + '</div>';
  const modal = document.getElementById('preview-modal');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePreview(e) {
  if (!e || e.target === document.getElementById('preview-modal')) {
    document.getElementById('preview-modal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

renderLanding();
</script>
</body>
</html>
